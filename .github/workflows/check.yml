name: Build and check models
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run pack
      - run: node scripts/build-viewer.cjs
      - run: npm run check:viewer
      - run: node renderer/javascript/build.cjs
      - run: node renderer/javascript/check.mjs
      - run: npm pack ./dist/javascript --pack-destination dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./renderer/python
      - run: python -m unittest discover -s renderer/python/tests -v
      - run: python -m pip wheel ./renderer/python --no-deps --wheel-dir dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: pink-bun-winefox
          path: |
            downloads/pink-bun-winefox.zip
            downloads/pink-bun-winefox-square-eyes.zip
            downloads/pink-bun-winefox-white-square-eyes.zip
            downloads/satou-aunt.zip
            docs/preview.png
            docs/preview-run-face.png
      - uses: actions/upload-artifact@v4
        with:
          name: pink-bun-model-studio
          path: dist/viewer/
      - uses: actions/upload-artifact@v4
        with:
          name: ysm-render-python
          path: dist/python/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: ysm-render-javascript
          path: dist/ysm-render-js-*.tgz
