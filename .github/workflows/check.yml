name: Build and check model
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: pink-bun-winefox
          path: |
            downloads/pink-bun-winefox.zip
            docs/preview.png
            docs/preview-run-face.png
